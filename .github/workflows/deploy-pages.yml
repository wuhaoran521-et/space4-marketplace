name: 部署 SPACE4 网页

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 获取源码
        uses: actions/checkout@v4

      - name: 配置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安装依赖
        run: npm install

      - name: 安装 Linux 构建组件
        run: npm install --no-save @tailwindcss/oxide-linux-x64-gnu@4.3.3 lightningcss-linux-x64-gnu@1.32.0

      - name: 构建静态网站
        env:
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
        run: npm run build

      - name: 注入原型地图测试配置
        env:
          AMAP_PROTOTYPE_KEY: ${{ secrets.AMAP_PROTOTYPE_KEY }}
          AMAP_PROTOTYPE_SECURITY_CODE: ${{ secrets.AMAP_PROTOTYPE_SECURITY_CODE }}
        run: |
          node - <<'JS'
          const fs = require('node:fs');
          const key = process.env.AMAP_PROTOTYPE_KEY;
          const securityJsCode = process.env.AMAP_PROTOTYPE_SECURITY_CODE;
          if (!key || !securityJsCode) throw new Error('缺少高德原型测试配置');
          fs.writeFileSync('apps/web/out/demo/amap-config.js',
            '/* Public prototype configuration; intentionally browser-readable. */\nwindow.Space4AmapConfig = ' +
            JSON.stringify({ key, securityJsCode }) + ';\n');
          JS

      - name: 配置 GitHub Pages
        uses: actions/configure-pages@v5

      - name: 上传网站产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: 发布 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
